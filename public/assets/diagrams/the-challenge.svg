<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="ch-title ch-desc" font-family="'Hanken Grotesk', system-ui, sans-serif">
  <title id="ch-title">Chronic neuroinflammation and progressive neuron loss</title>
  <desc id="ch-desc">A healthy neuron, with an intact cell body and branching processes, deteriorates under chronic neuroinflammation. Symptoms that begin mildly become progressively worse: the neuron's processes retract and it is ultimately lost. Neurons do not replace themselves, so once lost they are lost for good.</desc>

  <defs>
    <marker id="ch-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9aa6b8"/>
    </marker>
  </defs>

  <rect width="760" height="380" fill="#F6F4EF"/>

  <!-- progression baseline arrow -->
  <path d="M70 320 H690" fill="none" stroke="#D5CEC0" stroke-width="1.5" marker-end="url(#ch-arrow)"/>
  <text x="380" y="345" font-size="12.5" fill="#626f85" text-anchor="middle" font-style="italic">progressive, irreversible loss over time</text>

  <!-- ===== Stage 1: Healthy ===== -->
  <g id="ch-healthy">
    <rect x="56" y="48" width="200" height="224" rx="16" fill="#FFFFFF" stroke="#D5CEC0" stroke-width="1"/>
    <text x="156" y="78" font-family="'Newsreader', Georgia, serif" font-size="18" font-weight="500" fill="#13243A" text-anchor="middle">Healthy</text>
    <!-- neuron: full dendrites + long axon -->
    <g stroke="#2F5FE0" stroke-width="2.4" fill="none" stroke-linecap="round">
      <path d="M156 168 L120 120"/><path d="M120 120 L104 104"/><path d="M120 120 L132 100"/>
      <path d="M156 168 L196 122"/><path d="M196 122 L212 108"/><path d="M196 122 L186 100"/>
      <path d="M156 168 L116 196"/><path d="M156 168 L200 192"/>
      <path d="M156 168 L156 252"/>
    </g>
    <circle cx="156" cy="168" r="20" fill="#2F5FE0"/>
    <circle cx="156" cy="252" r="5" fill="#2F5FE0"/>
  </g>

  <!-- ===== Stage 2: Inflamed / mild ===== -->
  <g id="ch-inflamed">
    <rect x="280" y="48" width="200" height="224" rx="16" fill="#FFFFFF" stroke="#D5CEC0" stroke-width="1"/>
    <text x="380" y="78" font-family="'Newsreader', Georgia, serif" font-size="18" font-weight="500" fill="#13243A" text-anchor="middle">Inflamed</text>
    <!-- inflammation halo -->
    <circle cx="380" cy="168" r="34" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 5" opacity="0.7"/>
    <!-- neuron: retracting, fewer/shorter processes -->
    <g stroke="#475569" stroke-width="2.2" fill="none" stroke-linecap="round">
      <path d="M380 168 L352 132"/>
      <path d="M380 168 L412 138"/>
      <path d="M380 168 L350 192"/>
      <path d="M380 168 L380 240" stroke-dasharray="2 6"/>
    </g>
    <circle cx="380" cy="168" r="18" fill="#475569"/>
  </g>

  <!-- ===== Stage 3: Lost ===== -->
  <g id="ch-lost">
    <rect x="504" y="48" width="200" height="224" rx="16" fill="#FFFFFF" stroke="#D5CEC0" stroke-width="1"/>
    <text x="604" y="78" font-family="'Newsreader', Georgia, serif" font-size="18" font-weight="500" fill="#13243A" text-anchor="middle">Lost</text>
    <!-- faint remnant -->
    <g stroke="#c7ccd4" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="2 6">
      <path d="M604 168 L582 140"/>
      <path d="M604 168 L626 146"/>
      <path d="M604 168 L604 220"/>
    </g>
    <circle cx="604" cy="168" r="14" fill="none" stroke="#c7ccd4" stroke-width="2" stroke-dasharray="3 5"/>
    <text x="604" y="256" font-size="11.5" fill="#626f85" text-anchor="middle">not replaced</text>
  </g>
</svg>
