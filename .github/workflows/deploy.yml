name: Build & Deploy to cPanel (staging)

# Builds the Astro static site and uploads dist/ to the cPanel host over SFTP
# (SSH). SFTP avoids FTP's separate passive data-channel, which the host
# firewall was blocking ("Timeout when trying to open data connection").
#
# STAGING-FIRST: this workflow targets the staging subfolder by default.
# Promoting to live is a deliberate manual step — see System/CLAUDE.md.
#
# Triggers:
#   - push to main  -> deploys to STAGING
#   - manual run    -> choose 'staging' or 'live' via the target input
#
# REQUIRED REPO SECRETS (Settings → Secrets and variables → Actions → Secrets):
#   SSH_HOST          cPanel server hostname or IP (NOT the ftp. host)
#   SSH_USER          main cPanel username (e.g. alsonex) — SSH logs in as this,
#                     not the deploy@ FTP sub-account
#   SSH_PRIVATE_KEY   the private key whose public half is authorised in
#                     cPanel → SSH Access → Manage SSH Keys
# OPTIONAL REPO VARIABLES (Variables tab) — override the defaults below:
#   SSH_PORT              SSH port (default 22; some cPanel hosts use 2222/2083)
#   REMOTE_DIR_STAGING    default /home/alsonex/public_html/staging
#   REMOTE_DIR_LIVE       default /home/alsonex/public_html

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - live

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Astro static)
        run: npm run build

      - name: Resolve deploy target
        id: target
        run: |
          if [ "${{ github.event.inputs.target }}" = "live" ]; then
            echo "dir=${{ vars.REMOTE_DIR_LIVE || '/home/alsonex/public_html' }}" >> "$GITHUB_OUTPUT"
            echo "env=LIVE" >> "$GITHUB_OUTPUT"
          else
            echo "dir=${{ vars.REMOTE_DIR_STAGING || '/home/alsonex/public_html/staging' }}" >> "$GITHUB_OUTPUT"
            echo "env=STAGING" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SFTP (${{ steps.target.outputs.env }})
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT || 22 }}
          # uploads the CONTENTS of dist/ into the remote dir.
          # contact-handler.php ships inside dist/ (from public/) so it goes too.
          local_path: './dist/*'
          remote_path: ${{ steps.target.outputs.dir }}
          sftp_only: true
          # keep false so we never wipe the remote dir mid-deploy
          delete_remote_files: false
